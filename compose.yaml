services:
    app:
        build:
            context: .
            target: app
        image: mini-booking-app
        ports:
            - '${APP_PORT:-8000}:80'
        env_file: .env
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-mini_booking}
            DB_USERNAME: ${DB_USERNAME:-mini_booking}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - storage:/var/www/html/storage/app
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-mini_booking}
            POSTGRES_USER: ${DB_USERNAME:-mini_booking}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    pgdata:
    storage:
